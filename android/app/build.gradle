plugins {
    id "com.android.application"
}

def releaseStorePath = System.getenv("HAOLEME_ANDROID_KEYSTORE") ?: ""
def releaseStorePassword = System.getenv("HAOLEME_ANDROID_KEYSTORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("HAOLEME_ANDROID_KEY_ALIAS") ?: ""
def releaseKeyPassword = System.getenv("HAOLEME_ANDROID_KEY_PASSWORD") ?: ""
// Server URL + update manifest URLs. Override with -PHAOLEME_DEFAULT_SERVER_URL /
// -PHAOLEME_UPDATE_URLS (or env vars) for self-hosting.
// Update URLs support comma or space separated list. GitHub raw is included as a
// reliable public fallback so the app can always discover new versions for self-update
// even if the server manifest is temporarily stale or unreachable.
def defaultServerUrl = (project.findProperty("HAOLEME_DEFAULT_SERVER_URL") ?: System.getenv("HAOLEME_DEFAULT_SERVER_URL") ?: "https://api.haoleme.cloud").toString()
def defaultUpdateUrls = (project.findProperty("HAOLEME_UPDATE_URLS") ?: System.getenv("HAOLEME_UPDATE_URLS") ?: "https://raw.githubusercontent.com/HaolemeApp/Haoleme/main/update.json https://api.haoleme.cloud/downloads/update.json").toString()

// Robust paths for legacy fixed debug signing key (committed so all builds have identical cert).
// This ensures consistent developer signature across machines/builds for seamless updates.
def legacyKeystore = rootProject.file("legacy/debug.keystore")
def manualKeystore = rootProject.file("build/manual/debug.keystore")
def hasReleaseSigning = releaseStorePath
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword
        && file(releaseStorePath).isFile()
def hasLegacyCompatSigning = legacyKeystore.isFile() || manualKeystore.isFile()

android {
    namespace "com.haoleme.app"
    compileSdk 35
    buildToolsVersion "35.0.0"

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        haoleme {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                println "Haoleme signing: using RELEASE keystore from env"
            } else if (hasLegacyCompatSigning) {
                def ksFile = legacyKeystore.isFile() ? legacyKeystore : manualKeystore
                storeFile ksFile
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
                println "Haoleme signing: using LEGACY compat keystore for consistent signature: ${ksFile}"
            } else {
                println "Haoleme signing: FALLBACK to debug (no legacy/release available) -- signature will be inconsistent!"
                initWith signingConfigs.debug
            }
        }
    }

    defaultConfig {
        applicationId "com.haoleme.app"
        minSdk 23
        targetSdk 35
        versionCode 174
        versionName "0.9.39"
        buildConfigField "String", "HAOLEME_DEFAULT_SERVER_URL", "\"${defaultServerUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "HAOLEME_UPDATE_URLS", "\"${defaultUpdateUrls.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", "\\n")}\""

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.haoleme
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }
}

dependencies {
    def camerax_version = "1.5.1"
    implementation files("libs/core-3.5.3.jar")
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
